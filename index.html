<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
          initial-scale=1.0,
          maximum-scale=1.0,
          user-scalable=no">

    <title>Lion Chase - Forest Run</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">

    <div class="top-bar">

        <div>
            <span>DISTANCE</span>
            <strong id="score">0</strong>
        </div>

        <div>
            <span>🪙 COINS</span>
            <strong id="coins">0</strong>
        </div>

        <div>
            <span>BEST</span>
            <strong id="best">0</strong>
        </div>

    </div>

    <div id="playerName">
        🦁 LION CHASE
    </div>


    <div id="gameArea">

        <div class="sky"></div>

        <div class="mountain mountain-one"></div>
        <div class="mountain mountain-two"></div>

        <div class="forest-background">

            <div class="tree bg-tree tree-a">🌲</div>
            <div class="tree bg-tree tree-b">🌲</div>
            <div class="tree bg-tree tree-c">🌲</div>
            <div class="tree bg-tree tree-d">🌲</div>

        </div>


        <div class="trail">

            <div class="trail-line line-one"></div>
            <div class="trail-line line-two"></div>

            <div class="side-tree left-tree one">🌲</div>
            <div class="side-tree left-tree two">🌲</div>
            <div class="side-tree left-tree three">🌳</div>

            <div class="side-tree right-tree one">🌲</div>
            <div class="side-tree right-tree two">🌲</div>
            <div class="side-tree right-tree three">🌳</div>


            <div id="objects"></div>


            <!-- LION -->

            <div id="lion" class="lion">
                🦁
            </div>


            <!-- RUNNER -->

            <div id="player" class="player">

                <div class="head"></div>

                <div class="hair"></div>

                <div class="body"></div>

                <div class="arm arm-left"></div>
                <div class="arm arm-right"></div>

                <div class="leg leg-left"></div>
                <div class="leg leg-right"></div>

            </div>

        </div>


        <div id="distanceMessage">
            RUN! 🦁
        </div>


        <!-- START SCREEN -->

        <div id="startScreen">

            <div class="start-lion">
                🦁
            </div>

            <h1>LION CHASE</h1>

            <p>
                Run through the forest<br>
                and escape the lion!
            </p>

            <button onclick="startGame()">
                🏃 START RUN
            </button>

        </div>


        <!-- GAME OVER -->

        <div id="gameOver">

            <div class="game-over-icon">
                😱🦁
            </div>

            <h2>THE LION CAUGHT YOU!</h2>

            <p id="finalScore">
                Distance: 0
            </p>

            <button onclick="startGame()">
                🔄 RUN AGAIN
            </button>

        </div>

    </div>


    <div class="controls">

        <button id="leftButton">
            ⬅️
        </button>

        <button id="jumpButton">
            ⬆️
            <small>JUMP</small>
        </button>

        <button id="rightButton">
            ➡️
        </button>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
